name: Game

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            action/package-lock.json
            game/package-lock.json
      - name: Side-scrolling action (site root)
        working-directory: action
        run: |
          npm ci
          npm test
          npm run build
      - name: Card demo (/cards/)
        working-directory: game
        run: |
          npm ci
          npm test
          npm run build
      - name: Combine both builds into one site
        run: |
          mkdir -p site/cards
          cp -r action/dist/. site/
          cp -r game/dist/. site/cards/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
